<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe &amp; Vanilla | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="brand">Vibe &amp; Vanilla</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <p class="tagline">Stop by for a quiet cup or send us a note.</p>

    <section class="info-section">
      <h2>Café Hours &amp; Location</h2>
      <p><strong>Hours:</strong> Open daily, 8:00 AM – 10:00 PM</p>
      <p><strong>Location:</strong> Islamabad</p>
    </section>

    <section>
      <h2>Send a Message</h2>
      <form onsubmit="submitForm(event)">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Write your message..." required></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Vibe &amp; Vanilla. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
